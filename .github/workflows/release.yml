name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev libclang-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: cargo build --release --locked -p airmicd
        working-directory: desktop
      - name: Package tarball
        run: |
          version="${GITHUB_REF_NAME#v}"
          dir="airmic-${version}-x86_64-linux"
          mkdir "$dir"
          cp desktop/target/release/airmicd packaging/airmicd.service README.md LICENSE "$dir/"
          tar czf "$dir.tar.gz" "$dir"
          sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"
          echo "ARCHIVE=$dir.tar.gz" >> "$GITHUB_ENV"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "AirMic $GITHUB_REF_NAME" --generate-notes "$ARCHIVE" "$ARCHIVE.sha256"
