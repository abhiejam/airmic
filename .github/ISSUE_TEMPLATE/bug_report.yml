name: Bug report
description: Something doesn't work as described in the README.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Output of `airmicd status`
      description: Run it while the problem happens.
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Daemon log
      description: "Optional. The last lines of `journalctl --user -u airmicd -n 100`."
      render: text
  - type: input
    id: linux
    attributes:
      label: Linux distribution and version
      placeholder: Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: pipewire
    attributes:
      label: PipeWire version
      description: "`pipewire --version`"
      placeholder: "1.0.5"
    validations:
      required: true
  - type: input
    id: iphone
    attributes:
      label: iPhone model and iOS version
      placeholder: iPhone 15, iOS 18.6
    validations:
      required: true
  - type: input
    id: airmic
    attributes:
      label: AirMic version
      description: The release you downloaded, or the commit you built from.
