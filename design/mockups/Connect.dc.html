<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Connect to a computer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
button,input{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 60px 24px 40px; display: flex; flex-direction: column; background: {{t.bg}}; color: {{t.ink}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif; overflow: hidden">

  <a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid {{t.line}}; background: {{t.surface}}; color: {{t.ink}}; display: flex; align-items: center; justify-content: center; text-decoration: none">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
  </a>

  <h1 style="margin: 28px 0 0; font-weight: 600; font-size: 28px; line-height: 1.2; letter-spacing: -0.02em">Connect to a computer</h1>
  <p style="margin: 10px 0 0; font-size: 15px; line-height: 1.5; color: {{t.muted}}">Open AirMic on your computer. Both devices need to be on the same Wi-Fi.</p>

  <div style="margin-top: 40px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: {{t.muted}}">
    <span>Nearby</span>
    <span style="display: flex; align-items: center; gap: 6px; letter-spacing: 0; text-transform: none; font-size: 13px">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: {{t.accent}}"></span>
      Searching
    </span>
  </div>

  <div style="margin-top: 14px; padding: 20px; border-radius: 22px; background: {{t.surface}}; border: 1.5px solid {{t.accent}}; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; align-items: center; gap: 12px">
      <div style="width: 44px; height: 44px; border-radius: 14px; background: {{t.accentSoft}}; color: {{t.accent}}; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg>
      </div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; font-weight: 600">ubuntu-desk</span>
        <span style="font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12px; color: {{t.muted}}">Ubuntu · 192.168.1.42</span>
      </div>
      <div style="width: 26px; height: 26px; border-radius: 50%; background: {{t.accent}}; color: {{t.onAccent}}; display: flex; align-items: center; justify-content: center">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
      </div>
    </div>
    <div style="height: 1px; background: {{t.line}}"></div>
    <div style="display: flex; flex-direction: column; gap: 14px">
      <span style="font-size: 14px; color: {{t.muted}}">Enter the code shown on ubuntu-desk</span>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
        <input aria-label="Code digit 1" defaultValue="4" maxLength="1" inputMode="numeric" style="height: 60px; min-width: 0; box-sizing: border-box; border-radius: 14px; border: 1px solid {{t.line}}; background: {{t.bg}}; color: {{t.ink}}; text-align: center; font-size: 26px; font-weight: 500; outline: none">
        <input aria-label="Code digit 2" defaultValue="8" maxLength="1" inputMode="numeric" style="height: 60px; min-width: 0; box-sizing: border-box; border-radius: 14px; border: 1px solid {{t.line}}; background: {{t.bg}}; color: {{t.ink}}; text-align: center; font-size: 26px; font-weight: 500; outline: none">
        <input aria-label="Code digit 3" maxLength="1" inputMode="numeric" style="height: 60px; min-width: 0; box-sizing: border-box; border-radius: 14px; border: 2px solid {{t.accent}}; background: {{t.bg}}; color: {{t.ink}}; text-align: center; font-size: 26px; font-weight: 500; outline: none">
        <input aria-label="Code digit 4" maxLength="1" inputMode="numeric" style="height: 60px; min-width: 0; box-sizing: border-box; border-radius: 14px; border: 1px solid {{t.line}}; background: {{t.bg}}; color: {{t.ink}}; text-align: center; font-size: 26px; font-weight: 500; outline: none">
      </div>
    </div>
  </div>

  <button style="margin-top: 14px; padding: 18px 20px; border-radius: 22px; background: {{t.surface}}; border: 1px solid {{t.line}}; color: {{t.ink}}; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer">
    <span style="width: 44px; height: 44px; border-radius: 14px; background: {{t.bg}}; color: {{t.muted}}; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg>
    </span>
    <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 16px; font-weight: 600">studio-pc</span>
      <span style="font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12px; color: {{t.muted}}">Fedora · 192.168.1.57</span>
    </span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
  </button>
  <p style="margin: 16px 0 0; text-align: center; font-size: 13px; color: {{t.muted}}">Computer not listed? Get the app at <a href="#" style="color: {{t.accent}}; font-weight: 500">onairmic.com</a></p>

  <div style="flex-grow: 1"></div>

  <div style="font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: {{t.muted}}">Other ways</div>
  <div style="margin-top: 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
    <button style="flex-shrink: 0; height: 56px; border-radius: 28px; border: 1px solid {{t.line}}; background: {{t.surface}}; color: {{t.ink}}; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 500; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><path d="M14 14h3v3M21 14v.01M14 21h7v-4"></path></svg>
      Scan QR code
    </button>
    <button style="flex-shrink: 0; height: 56px; border-radius: 28px; border: 1px solid {{t.line}}; background: {{t.surface}}; color: {{t.ink}}; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 500; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h16M4 15h16M10 3L8 21M16 3l-2 18"></path></svg>
      Enter IP address
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#5146E5","options":["#5146E5","#2F6BEA","#7A4CE0"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  rgb(h) { h = h.replace('#', ''); return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16)); }
  mix(a, b, p) { const x = this.rgb(a), y = this.rgb(b); return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * p).toString(16).padStart(2, '0')).join(''); }
  rgba(h, a) { const c = this.rgb(h); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
  theme(dark, accent) {
    if (dark) {
      const acc = this.mix(accent, '#ffffff', 0.3);
      return { bg: '#111114', surface: '#1B1B20', ink: '#F3F0E8', muted: '#A3A1AB', line: '#2C2C33', accent: acc, onAccent: '#111114', accentSoft: this.rgba(acc, 0.14) };
    }
    return { bg: '#F6F2EA', surface: '#FFFDF8', ink: '#1B1A22', muted: '#66646E', line: '#E6E0D3', accent: accent, onAccent: '#FFFFFF', accentSoft: this.rgba(accent, 0.1) };
  }
  renderVals() {
    return { t: this.theme(!!this.props.dark, this.props.accent ?? '#5146E5') };
  }
}
</script>
</body>
</html>
