<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Session summary</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 60px 24px 40px; display: flex; flex-direction: column; background: {{t.bg}}; color: {{t.ink}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: {{t.muted}}">Session complete</span>
    <a href="Main.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid {{t.line}}; background: {{t.surface}}; color: {{t.ink}}; display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
  </div>

  <h1 style="margin: 20px 0 0; font-weight: 600; font-size: 28px; line-height: 1.2; letter-spacing: -0.02em">52 minutes of deep work</h1>
  <p style="margin: 8px 0 0; font-size: 15px; color: {{t.muted}}">Streamed to ubuntu-desk · 9:12 – 10:04 am</p>

  <div style="margin-top: 32px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <div style="padding: 14px; border-radius: 18px; background: {{t.surface}}; border: 1px solid {{t.line}}; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 22px; font-weight: 600; letter-spacing: -0.02em">1,204</span>
      <span style="font-size: 12px; color: {{t.muted}}">words spoken</span>
    </div>
    <div style="padding: 14px; border-radius: 18px; background: {{t.surface}}; border: 1px solid {{t.line}}; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 22px; font-weight: 600; letter-spacing: -0.02em">3</span>
      <span style="font-size: 12px; color: {{t.muted}}">times muted</span>
    </div>
    <div style="padding: 14px; border-radius: 18px; background: {{t.surface}}; border: 1px solid {{t.line}}; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 22px; font-weight: 600; letter-spacing: -0.02em">0</span>
      <span style="font-size: 12px; color: {{t.muted}}">dropouts</span>
    </div>
  </div>

  <div style="margin-top: 10px; padding: 16px; border-radius: 20px; background: {{t.surface}}; border: 1px solid {{t.line}}; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <span style="font-size: 14px; font-weight: 600">This week</span>
      <span style="font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 13px; color: {{t.muted}}">4h 20m focused</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: end">
      <sc-for list="{{week}}" as="d" hint-placeholder-count="7">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
          <div style="height: 72px; width: 100%; display: flex; align-items: flex-end; justify-content: center">
            <div style="width: 22px; height: {{d.h}}; border-radius: 6px; background: {{d.color}}"></div>
          </div>
          <span style="font-size: 11px; color: {{d.labelColor}}">{{d.label}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="margin-top: 10px; padding: 16px; border-radius: 20px; background: {{t.surface}}; border: 1px solid {{t.line}}; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: {{t.muted}}">Last thing you said</span>
    <span style="font-size: 16px; line-height: 1.5">“…create the PipeWire source by name, then make it the default input.”</span>
  </div>

  <div style="flex-grow: 1"></div>

  <a href="Main.dc.html" style="margin: 0 auto; width: 280px; flex-shrink: 0; height: 56px; border-radius: 28px; background: {{t.accent}}; color: {{t.onAccent}}; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 16px; font-weight: 500">Start another session</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#5146E5","options":["#5146E5","#2F6BEA","#7A4CE0"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  rgb(h) { h = h.replace('#', ''); return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16)); }
  mix(a, b, p) { const x = this.rgb(a), y = this.rgb(b); return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * p).toString(16).padStart(2, '0')).join(''); }
  rgba(h, a) { const c = this.rgb(h); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
  theme(dark, accent) {
    if (dark) {
      const acc = this.mix(accent, '#ffffff', 0.3);
      return { bg: '#111114', surface: '#1B1B20', ink: '#F3F0E8', muted: '#A3A1AB', line: '#2C2C33', accent: acc, onAccent: '#111114', bar: this.rgba(acc, 0.28) };
    }
    return { bg: '#F6F2EA', surface: '#FFFDF8', ink: '#1B1A22', muted: '#66646E', line: '#E6E0D3', accent: accent, onAccent: '#FFFFFF', bar: this.rgba(accent, 0.2) };
  }
  renderVals() {
    const t = this.theme(!!this.props.dark, this.props.accent ?? '#5146E5');
    const mins = [48, 70, 30, 80, 56, 52, 0];
    const labels = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
    const today = 5;
    const week = mins.map((m, i) => ({
      h: Math.max(4, Math.round(m / 80 * 72)) + 'px',
      color: i === today ? t.accent : (m ? t.bar : t.line),
      label: labels[i],
      labelColor: i === today ? t.ink : t.muted
    }));
    return { t, week };
  }
}
</script>
</body>
</html>
