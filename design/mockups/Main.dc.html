<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AirMic home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
button{font:inherit}
@keyframes am-pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.55);opacity:0}}
.am-ring{position:absolute;border-radius:50%;box-sizing:border-box;animation:am-pulse 2.4s ease-out infinite}
@keyframes am-bar{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.am-bar{animation:am-bar 1.1s ease-in-out infinite;transform-origin:center}
@media (prefers-reduced-motion: reduce){.am-ring,.am-bar{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 60px 24px 40px; display: flex; flex-direction: column; background: {{t.bg}}; color: {{t.ink}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 20px; letter-spacing: -0.03em">
      <svg width="28" height="28" viewBox="0 0 100 100" fill="none" stroke="{{t.accent}}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g transform="translate(-4 10)"><rect x="31" y="14" width="20" height="36" rx="10"></rect><path d="M26 44 A15 15 0 0 0 56 44"></path><path d="M41 59 V72"></path><path d="M32 72 H50"></path><path d="M62.4 14 A28 28 0 0 1 62.4 50"></path><path d="M73.2 5 A42 42 0 0 1 73.2 59"></path></g></svg>
      <span>AirMic</span>
    </div>
    <button aria-label="Settings" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid {{t.line}}; background: {{t.surface}}; color: {{t.ink}}; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h9M19 7h1M4 17h3M13 17h7"></path><circle cx="16" cy="7" r="2.5"></circle><circle cx="10" cy="17" r="2.5"></circle></svg>
    </button>
  </div>

  <div style="margin-top: 28px; align-self: center; display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: {{t.surface}}; border: 1px solid {{t.line}}; font-size: 14px">
    <span style="width: 8px; height: 8px; border-radius: 50%; background: {{statusDot}}"></span>
    <span>{{statusText}}</span>
    <sc-if value="{{live}}" hint-placeholder-val="{{true}}">
      <span style="color: {{t.muted}}; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12px">12 ms</span>
    </sc-if>
  </div>

  <div style="margin-top: 32px; display: flex; flex-direction: column; align-items: center; gap: 6px">
    <div style="font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: {{t.muted}}">{{timerLabel}}</div>
    <div style="font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 72px; font-weight: 300; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">{{timer}}</div>
    <div style="width: 140px; height: 4px; border-radius: 2px; background: {{t.line}}; margin-top: 10px; overflow: hidden">
      <div style="width: {{progress}}; height: 100%; border-radius: 2px; background: {{t.accent}}"></div>
    </div>
    <div style="font-size: 13px; color: {{t.muted}}; margin-top: 4px">{{goalText}}</div>
  </div>

  <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px">
    <div style="position: relative; width: 272px; height: 272px; display: flex; align-items: center; justify-content: center">
      <sc-if value="{{live}}" hint-placeholder-val="{{true}}">
        <div style="position: absolute; width: 260px; height: 260px; border-radius: 50%; background: {{t.accentSoft}}"></div>
        <div class="am-ring" style="width: 188px; height: 188px; border: 2px solid {{t.accent}}; animation-delay: 0s"></div>
        <div class="am-ring" style="width: 188px; height: 188px; border: 2px solid {{t.accent}}; animation-delay: 0.8s"></div>
        <div class="am-ring" style="width: 188px; height: 188px; border: 2px solid {{t.accent}}; animation-delay: 1.6s"></div>
        <div aria-hidden="true" style="position: relative; width: 188px; height: 188px; border-radius: 50%; background: {{t.accent}}; color: {{t.onAccent}}; box-shadow: 0 24px 48px -16px {{t.accentShadow}}; display: flex; align-items: center; justify-content: center">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0"></path><path d="M12 17.5V21"></path></svg>
        </div>
      </sc-if>
      <sc-if value="{{isMuted}}" hint-placeholder-val="{{false}}">
        <div aria-hidden="true" style="position: relative; width: 188px; height: 188px; border-radius: 50%; background: {{t.surface}}; border: 1px solid {{t.line}}; color: {{t.muted}}; display: flex; align-items: center; justify-content: center">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0"></path><path d="M12 17.5V21"></path><path d="M3.5 3.5l17 17"></path></svg>
        </div>
      </sc-if>
      <sc-if value="{{idle}}" hint-placeholder-val="{{false}}">
        <a href="Connect.dc.html" aria-label="Connect to a computer" style="position: relative; width: 188px; height: 188px; box-sizing: border-box; border-radius: 50%; border: 2px dashed {{t.accent}}; color: {{t.accent}}; display: flex; align-items: center; justify-content: center; text-decoration: none">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0"></path><path d="M12 17.5V21"></path></svg>
        </a>
      </sc-if>
    </div>

    <div aria-hidden="true" style="height: 36px; display: flex; align-items: center; gap: 4px">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="28">
        <span class="{{b.cls}}" style="width: 4px; height: {{b.h}}; border-radius: 2px; background: {{b.color}}; animation-delay: {{b.delay}}"></span>
      </sc-for>
    </div>
    <div style="font-size: 14px; color: {{t.muted}}">{{caption}}</div>
  </div>

  <sc-if value="{{connected}}" hint-placeholder-val="{{true}}">
    <div style="flex-shrink: 0; display: flex; align-items: center; justify-content: space-between">
      <a href="Summary.dc.html" style="height: 48px; padding: 0 20px; border-radius: 24px; border: 1px solid {{t.line}}; background: {{t.surface}}; color: {{t.ink}}; display: flex; align-items: center; gap: 8px; text-decoration: none; font-size: 15px; font-weight: 500">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>
        End session
      </a>
      <button onClick="{{toggle}}" aria-label="{{muteLabel}}" aria-pressed="{{muted}}" style="width: 68px; height: 68px; border-radius: 50%; border: none; background: {{fabBg}}; color: {{fabFg}}; box-shadow: 0 16px 32px -12px {{fabShadow}}; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
        <sc-if value="{{live}}" hint-placeholder-val="{{true}}">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0"></path><path d="M12 17.5V21"></path></svg>
        </sc-if>
        <sc-if value="{{isMuted}}" hint-placeholder-val="{{false}}">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0"></path><path d="M12 17.5V21"></path><path d="M3.5 3.5l17 17"></path></svg>
        </sc-if>
      </button>
    </div>
  </sc-if>
  <sc-if value="{{idle}}" hint-placeholder-val="{{false}}">
    <a href="Connect.dc.html" style="margin: 32px auto 0; width: 280px; flex-shrink: 0; height: 56px; border-radius: 28px; background: {{t.accent}}; color: {{t.onAccent}}; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 16px; font-weight: 500">Connect to a computer</a>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"muted":{"editor":"boolean","default":false},"connected":{"editor":"boolean","default":true},"accent":{"editor":"color","default":"#5146E5","options":["#5146E5","#2F6BEA","#7A4CE0"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  rgb(h) { h = h.replace('#', ''); return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16)); }
  mix(a, b, p) { const x = this.rgb(a), y = this.rgb(b); return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * p).toString(16).padStart(2, '0')).join(''); }
  rgba(h, a) { const c = this.rgb(h); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
  theme(dark, accent) {
    if (dark) {
      const acc = this.mix(accent, '#ffffff', 0.3);
      return { bg: '#111114', surface: '#1B1B20', ink: '#F3F0E8', muted: '#A3A1AB', line: '#2C2C33', accent: acc, onAccent: '#111114', accentSoft: this.rgba(acc, 0.12), accentShadow: this.rgba(acc, 0.45), warn: '#F0894A', onWarn: '#111114', ok: '#4CC38A' };
    }
    return { bg: '#F6F2EA', surface: '#FFFDF8', ink: '#1B1A22', muted: '#66646E', line: '#E6E0D3', accent: accent, onAccent: '#FFFFFF', accentSoft: this.rgba(accent, 0.08), accentShadow: this.rgba(accent, 0.5), warn: '#C2410C', onWarn: '#FFFFFF', ok: '#2F8F5B' };
  }
  renderVals() {
    const t = this.theme(!!this.props.dark, this.props.accent ?? '#5146E5');
    const connected = this.props.connected ?? true;
    const s = this.state || {};
    const muted = s.muted != null ? s.muted : !!this.props.muted;
    const live = connected && !muted;
    const isMuted = connected && muted;
    const idle = !connected;
    const heights = [10, 18, 26, 14, 30, 22, 12, 34, 24, 16, 28, 20, 36, 18, 26, 32, 14, 22, 30, 12, 24, 34, 16, 20, 28, 14, 18, 10];
    const bars = heights.map((h, i) => ({
      h: (live ? h : 4) + 'px',
      cls: live ? 'am-bar' : '',
      color: live ? t.accent : t.line,
      delay: ((i * 0.13) % 1.1).toFixed(2) + 's'
    }));
    return {
      t, connected, live, isMuted, idle, muted, bars,
      statusDot: idle ? t.muted : (muted ? t.warn : t.ok),
      statusText: idle ? 'No computer connected' : (muted ? 'Off air · ubuntu-desk' : 'On air · ubuntu-desk'),
      timerLabel: idle ? 'Ready when you are' : 'Focus session',
      timer: idle ? '00:00' : '24:18',
      progress: idle ? '0%' : '48%',
      goalText: idle ? 'Goal 50 min' : '26 min to your 50 min goal',
      caption: idle ? 'Tap the mic to find your computer' : (muted ? 'Muted · your PC hears silence' : 'Listening'),
      muteLabel: muted ? 'Unmute' : 'Mute',
      fabBg: muted ? t.warn : t.ink,
      fabFg: muted ? t.onWarn : t.bg,
      fabShadow: muted ? this.rgba(t.warn, 0.55) : 'rgba(0,0,0,0.35)',
      toggle: () => this.setState({ muted: !muted })
    };
  }
}
</script>
</body>
</html>
