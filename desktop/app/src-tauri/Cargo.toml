[package]
name = "airmic-app"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/abhiejam/airmic"

[lib]
name = "airmic_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Its own workspace: the daemon's CI (`cargo clippy --workspace`) must not need the webkit libraries.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["net", "time", "sync", "macros", "rt"] }
tokio-util = { version = "0.7", features = ["codec"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "io-util"] }
