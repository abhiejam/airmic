[package]
name = "airmicd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
airmic-proto.workspace = true
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync", "signal"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }
