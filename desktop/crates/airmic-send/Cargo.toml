[package]
name = "airmic-send"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
airmic-proto.workspace = true
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
hound = "3.5.1"
rand = "0.10.3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
